# Complete runtime packages plus the matching backend sources, in one draft release.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (must match the CMake project version)
        required: true
        default: v0.2.0

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  runtime-inputs:
    name: Freeze ${{ matrix.platform }} runtime inputs
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-arm64, windows-x86_64, linux-x86_64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore reviewed nightly snapshot when available
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/core-inputs"
          gh release download "$RELEASE_TAG" --pattern build-input-cores.zip --dir "$RUNNER_TEMP/core-inputs" || \
            echo 'No saved nightly snapshot; all upstream inputs will still require their pinned hashes.'
      - name: Download and verify reviewed runtime archives
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          python3 - <<'PY'
          import importlib.util, os, shutil, zipfile
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('bundle', 'scripts/bundle-backends.py')
          bundle = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(bundle)
          snapshot = Path(os.environ['RUNNER_TEMP']) / 'core-inputs/build-input-cores.zip'
          if snapshot.is_file():
              with zipfile.ZipFile(snapshot) as archive:
                  for item in bundle.load_lock()['binaries']:
                      if item['platform'] != os.environ['PLATFORM'] or item['sha256'] not in archive.namelist():
                          continue
                      assert archive.getinfo(item['sha256']).file_size == item['size'], item['id']
                      target = Path('runtime-inputs') / item['sha256']
                      target.parent.mkdir(exist_ok=True)
                      with archive.open(item['sha256']) as inp, target.open('wb') as out:
                          shutil.copyfileobj(inp, out, 1024 * 1024)
                      assert bundle.sha256(target) == item['sha256'], item['id']
          for item in bundle.load_lock()['binaries']:
              if item['platform'] == os.environ['PLATFORM']:
                  print('Freezing verified runtime:', item['id'], flush=True)
                  path = bundle.download(item['url'], item['sha256'], Path('runtime-inputs'))
                  if 'size' in item:
                      assert path.stat().st_size == item['size'], item['id']
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-inputs-${{ matrix.platform }}
          path: runtime-inputs/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  sources:
    name: Mirror matching backend sources
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@v4
        id: source-cache
        with:
          path: dist/sources
          key: backend-sources-${{ hashFiles('packaging/*sources*.json', 'packaging/backend-lock.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            backend-sources-${{ hashFiles('packaging/*sources*.json', 'packaging/backend-lock.json') }}-
            backend-sources-
      - name: Check release version
        run: |
          version="$(sed -n 's/^project([^)]*VERSION \([0-9][0-9.]*\).*/\1/p' CMakeLists.txt | head -n1)"
          case "${RELEASE_TAG#v}" in
            "$version" | "$version"-*) ;;
            *) echo "::error::Release tag does not match project version $version"; exit 1 ;;
          esac
      - name: Install archive tools
        run: sudo apt-get update -q && sudo apt-get install -y -q p7zip-full subversion zstd
      - name: Make room for matching source trees
        run: |
          # This source-only runner does not build Android or .NET applications.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet
          df -h .
      - name: Mirror source and license files
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/bundle-backends.py sources --output dist/sources --cache .bundle-cache
      - uses: actions/cache/save@v4
        if: always() && steps.source-cache.outputs.cache-hit != 'true'
        with:
          path: dist/sources
          key: backend-sources-${{ hashFiles('packaging/*sources*.json', 'packaging/backend-lock.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        with:
          name: source-notices
          path: |
            dist/sources/source-manifest.json
            dist/sources/SOURCE-README.txt
            dist/sources/licenses/
            dist/sources/runtime-data/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: release-backend-sources
          path: |
            dist/sources/rrm-source-*
            dist/sources/source-manifest.json
            dist/sources/SOURCE-README.txt
          compression-level: 0
          if-no-files-found: error

  package:
    name: Package ${{ matrix.name }}
    needs: [sources, runtime-inputs]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (arm64)
            os: macos-latest
            platform: macos-arm64
            script: scripts/build-macos.sh
            package: RidgeRacerMarathon-macos-arm64.zip
          - name: Linux (x64)
            os: ubuntu-22.04
            platform: linux-x86_64
            script: scripts/build-linux.sh
            package: RidgeRacerMarathon-linux-x64.tar.gz
          - name: Windows (x64)
            os: ubuntu-latest
            platform: windows-x86_64
            script: scripts/build-windows.sh
            package: RidgeRacerMarathon-windows-x64.zip
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: source-notices
          path: source-notices
      - uses: actions/download-artifact@v4
        with:
          name: runtime-inputs-${{ matrix.platform }}
          path: .bundle-cache
      - name: Install tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja sevenzip
      - name: Install tools (Linux runners)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q p7zip-full
      - name: Install packages (Linux)
        if: matrix.platform == 'linux-x86_64'
        run: bash .github/scripts/install-linux-deps.sh
      - name: Install mingw-w64
        if: matrix.platform == 'windows-x86_64'
        run: sudo apt-get install -y -q --no-install-recommends mingw-w64 ninja-build zip
      - name: Assemble pinned offline backends
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/bundle-backends.py bundle
          --platform '${{ matrix.platform }}'
          --output "$RUNNER_TEMP/offline-bundle"
          --source-index source-notices/source-manifest.json
          --licenses source-notices/licenses
          --runtime-data source-notices/runtime-data
          --cache .bundle-cache
      - name: Build Complete package
        run: RRM_BUNDLE_DIR="$RUNNER_TEMP/offline-bundle" bash '${{ matrix.script }}'
      - name: Check asset size
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('dist/${{ matrix.package }}')
          assert 0 < p.stat().st_size < 2_000_000_000, 'Package exceeds GitHub asset limit'
          print(p.name, p.stat().st_size)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.package }}
          path: dist/${{ matrix.package }}
          compression-level: 0
          if-no-files-found: error

  test:
    name: Test ${{ matrix.name }}
    needs: package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS package
            os: macos-latest
            package: RidgeRacerMarathon-macos-arm64.zip
            app: RidgeRacerMarathon/Ridge Racer Marathon.app/Contents/MacOS/Ridge Racer Marathon
            bundle: RidgeRacerMarathon/Ridge Racer Marathon.app/Contents/Resources/bundle
          - name: Linux package
            os: ubuntu-22.04
            package: RidgeRacerMarathon-linux-x64.tar.gz
            app: RidgeRacerMarathon/bin/RidgeRacerMarathon
            bundle: RidgeRacerMarathon/share/ridge-racer-marathon/bundle
          - name: Windows package
            os: windows-latest
            package: RidgeRacerMarathon-windows-x64.zip
            app: RidgeRacerMarathon/RidgeRacerMarathon.exe
            bundle: RidgeRacerMarathon/bundle
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ matrix.package }}
          path: pkg
      - name: Unpack
        working-directory: pkg
        run: |
          case '${{ matrix.package }}' in
            *.tar.gz) tar xzf '${{ matrix.package }}' ;;
            *.zip) if command -v ditto >/dev/null; then ditto -x -k '${{ matrix.package }}' .; else 7z x -y '${{ matrix.package }}' >/dev/null; fi ;;
          esac
      - name: Start app and complete offline setup
        run: .github/scripts/smoke-app.sh 'pkg/${{ matrix.app }}' smoke
      - name: Check imported backends and load every core
        run: python3 .github/scripts/verify-bundle-install.py 'pkg/${{ matrix.bundle }}' smoke/appdata
      - name: Check Windows runtime helper (no install)
        if: runner.os == 'Windows'
        shell: powershell
        run: >-
          & 'pkg/RidgeRacerMarathon/bundle/prerequisites/Install-Windows-Runtime.ps1' -CheckOnly
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot-${{ matrix.package }}
          path: smoke/library.png
          if-no-files-found: ignore

  release:
    name: Draft Complete release
    needs: [sources, package, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify release inventory and checksums
        run: python3 .github/scripts/verify-release-inventory.py dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          draft: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          name: RIDGE RACER MARATHON ${{ env.RELEASE_TAG }} — Complete
          body_path: packaging/RELEASE_NOTES.md
          fail_on_unmatched_files: true
          preserve_order: true
          files: dist/*
